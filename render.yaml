services:
  - type: web
    name: video-downloader-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    repo: https://github.com/bot1004/descargavideos  # Deberás cambiar esto por tu repositorio
    branch: main
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: PORT
        value: 10000
    autoDeploy: true